    <style>
        /* Premium Design Theme */
        :root {
            --primary-color: #1A3C34;
            --primary-dark: #122b24;
            --secondary-color: #3D5A80;
            --background-light: #F4EDE4;
            --background-gray: #F5F5F5;
            --accent-color: #FF8C42;
            --accent-dark: #e67e3a;
            --text-primary: #1A3C34;
            --text-secondary: #5c6c68;
            --shadow-sm: 0 2px 4px rgba(26, 60, 52, 0.05);
            --shadow-md: 0 4px 6px rgba(26, 60, 52, 0.1);
            --shadow-lg: 0 10px 15px rgba(26, 60, 52, 0.1);
            --font-heading: 'Poppins', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-ui: 'Montserrat', sans-serif;
            --border-radius: 8px;
        }

        body {
            font-family: var(--font-body);
            color: var(--text-primary);
            background-color: var(--background-light);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: white;
            box-shadow: var(--shadow-md);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header .logo {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 1.5rem;
            font-family: var(--font-heading);
            text-decoration: none;
        }

        header nav ul {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        header nav ul li {
            margin-left: 20px;
        }

        header nav ul li a {
            color: var(--text-primary);
            font-weight: 500;
            transition: color 0.3s;
            font-family: var(--font-ui);
            text-decoration: none;
        }

        header nav ul li a:hover {
            color: var(--secondary-color);
        }

        .auth-container {
            max-width: 450px;
            margin: 50px auto;
            padding: 40px;
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            flex: 1;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            font-family: var(--font-heading);
            color: var(--primary-color);
            font-size: 2rem;
            margin: 0 0 10px 0;
        }

        .auth-header p {
            font-family: var(--font-body);
            color: var(--text-secondary);
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-family: var(--font-ui);
            font-weight: 500;
            color: var(--text-primary);
        }

        .password-criteria {
            margin-top: 5px;
            padding: 10px;
            background-color: var(--background-light);
            border-radius: var(--border-radius);
            margin-bottom: 15px;
            display: none;
        }

        .password-criteria.active {
            display: block;
        }

        .criteria-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .criteria-item i {
            margin-right: 5px;
            font-size: 0.9rem;
        }

        .criteria-item i.fa-check {
            color: green;
        }

        .criteria-item i.fa-times {
            color: #e74c3c;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-family: var(--font-body);
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
        }

        .form-control:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(61, 90, 128, 0.1);
            outline: none;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 15px;
            width: 100%;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
            font-family: var(--font-ui);
        }

        .btn:hover {
            background-color: var(--accent-dark);
            transform: translateY(-2px);
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            font-family: var(--font-body);
            color: var(--text-secondary);
        }

        .auth-footer a {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .auth-footer a:hover {
            color: var(--primary-color);
            text-decoration: underline;
        }

        .social-login {
            margin-top: 30px;
            text-align: center;
        }

        .social-login p {
            font-family: var(--font-body);
            color: var(--text-secondary);
            margin-bottom: 15px;
            position: relative;
        }

        .social-login p::before,
        .social-login p::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 35%;
            height: 1px;
            background-color: #ddd;
        }

        .social-login p::before {
            left: 0;
        }

        .social-login p::after {
            right: 0;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .social-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            width: 130px;
            border-radius: var(--border-radius);
            border: 1px solid #ddd;
            background-color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-ui);
            font-weight: 500;
            color: #444;
            box-shadow: var(--shadow-sm);
        }

        .social-button:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .social-button.google {
            border-color: #4285F4;
        }

        .social-button.google i {
            color: #4285F4;
        }

        .social-button.facebook {
            border-color: #3b5998;
        }

        .social-button.facebook i {
            color: #3b5998;
        }

        .social-button i {
            margin-right: 10px;
            font-size: 1.1rem;
        }

        .form-check {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .form-check input {
            margin-right: 10px;
        }

        .form-check label {
            font-family: var(--font-body);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .error-message {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 5px;
            font-family: var(--font-body);
            display: none;
        }

        footer {
            background-color: var(--primary-color);
            color: white;
            padding: 20px 0;
            text-align: center;
            width: 100%;
            margin-top: 40px;
        }

        footer p {
            margin: 0;
            font-family: var(--font-body);
        }

        @media (max-width: 768px) {
            .auth-container {
                margin: 30px 20px;
                padding: 30px 20px;
            }
        }
    </style>

<body class="dark-theme gradient-background dark-mode">
    <header class="premium-header" id="premium-header">
        <a href="index.html" class="logo">Nutrition Tracker</a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-header">
            <h1>Create an Account</h1>
            <p>Join Nutrition Tracker and start your health journey today</p>
        </div>

        <form id="signupForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" class="form-control" required>
                <div class="error-message" id="nameError"></div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" required>
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input-container" style="position: relative;">
                    <input type="password" id="password" class="form-control" required>
                    <button type="button" id="togglePassword" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; z-index: 10;" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="password-criteria" style="margin-top: 10px; display: none; background-color: #f8f9fa; padding: 12px; border-radius: 8px; font-size: 0.9rem;">
                    <p class="criteria" id="length-check"><i class="fas fa-times-circle"></i> 8+ characters</p>
                    <p class="criteria" id="uppercase-check"><i class="fas fa-times-circle"></i> Uppercase letter</p>
                    <p class="criteria" id="lowercase-check"><i class="fas fa-times-circle"></i> Lowercase letter</p>
                    <p class="criteria" id="number-check"><i class="fas fa-times-circle"></i> Number</p>
                    <p class="criteria" id="special-check"><i class="fas fa-times-circle"></i> Special character</p>
                </div>
                <div class="error-message" id="passwordError"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-input-container" style="position: relative;">
                    <input type="password" id="confirmPassword" class="form-control" required>
                    <button type="button" id="toggleConfirmPassword" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; z-index: 10;" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="error-message" id="confirmPasswordError"></div>
            </div>

            <div class="form-check">
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to the <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a></label>
            </div>

            <button type="submit" class="btn">Create Account</button>
        </form>

        <div class="social-login">
            <p>Or sign up with</p>
            <div class="social-buttons">
                <button type="button" class="social-button google" id="googleSignIn">
                    <i class="fab fa-google"></i> Google
                </button>
                <button type="button" class="social-button facebook" id="facebookSignIn">
                    <i class="fab fa-facebook-f"></i> Facebook
                </button>
            </div>
            <div id="socialErrorMessage" style="color: #e74c3c; font-size: 0.9rem; margin-top: 15px; display: none;"></div>
        </div>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Log in</a>
        </div>
    </main>

    <div id="footer-container"></div>
