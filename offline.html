<!DOCTYPE html>
<html lang="en" class="dark-mode dark-theme">
<head>
    <meta name="theme-color" content="#1A3C34">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Offline - Nutrition Tracker</title>
    <style>
        :root {
            --primary-color: #1A3C34;
            --accent-color: #FF8C42;
            --background-light: #F4EDE4;
            --text-primary: #1A3C34;
            --text-secondary: #5c6c68;
            --font-heading: 'Poppins', sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Oxygen, Ubuntu, Cantarell, Fira Sans, Droid Sans, Helvetica Neue;
            --font-body: 'Inter', sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Oxygen, Ubuntu, Cantarell, Fira Sans, Droid Sans, Helvetica Neue;
        }
        
        body {
            font-family: var(--font-body);
            background-color: var(--background-light);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        
        .offline-container {
            max-width: 600px;
            background-color: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            font-family: var(--font-heading);
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 2rem;
        }
        
        p {
            margin-bottom: 20px;
            line-height: 1.6;
            color: var(--text-secondary);
        }
        
        .icon {
            font-size: 5rem;
            color: var(--accent-color);
            margin-bottom: 20px;
        }
        
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-family: var(--font-body);
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }
        
        .btn:hover {
            background-color: #122b24;
        }
        
        .btn-secondary {
            background-color: white;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            margin-left: 10px;
        }
        
        .btn-secondary:hover {
            background-color: var(--background-light);
        }
    </style>
    
    <!-- Footer Fix Scripts -->
    <script src="scripts/fix-header-scroll.js" defer></script>
    <script src="scripts/fix-scroll-errors.js" defer></script>
    <script src="scripts/fix-footer.js" defer></script>
    <script src="scripts/remove-spacers.js" defer></script>
    <link rel="stylesheet" href="styles/fix-scroll-smoothness.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">

    <!-- Dark Mode Enforcer - Load First -->
    <script src="scripts/dark-mode-enforcer.js"></script>

    <!-- Gradient Scroll Effect -->
    <script src="scripts/gradient-scroll.js" defer></script>
    <link rel="stylesheet" href="styles/complete-fixes.css">
    <link rel="stylesheet" href="styles/disable-old-floating-badge.css">

    <!-- Footer Fix Styles -->
    <link rel="stylesheet" href="styles/footer-elite-luxury.css">
        <link rel="stylesheet" href="styles/cleanup-scrolling.css">
    <link rel="stylesheet" href="styles/screenshot-fix.css">
</head>
<body class="dark-theme gradient-background dark-mode">
    <div class="offline-container">
        <div class="icon">
            <i class="fas fa-wifi-slash"></i>
        </div>
        <h1>You're Currently Offline</h1>
        <p>It seems you're not connected to the internet. Some features of Nutrition Tracker may not be available until you're back online.</p>
        <p>Don't worry, previously loaded data and cached content should still be accessible.</p>
        
        <div class="actions">
            <button class="btn" onclick="window.location.reload()">Try Again</button>
            <a href="index.html" class="btn btn-secondary">Go to Homepage</a>
        </div>
    </div>
    
    <script>
        // Check if we're back online
        window.addEventListener('online', () => {
            window.location.reload();
        });
        
        // For browsers that don't support the WiFi slash icon
        if (!document.querySelector('.fa-wifi-slash')) {
            document.querySelector('.icon').innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
        }
    </script>
    <script src="scripts/screenshot-mode.js"></script>
    <script src="scripts/microsoft-screenshot-fix.js"></script>
</body>
</html>
