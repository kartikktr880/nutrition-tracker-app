    <!-- STEP 3: Add this script before the closing     <script src="scripts/screenshot-mode.js"></script>
    <script src="scripts/microsoft-screenshot-fix.js"></script>
</body> tag -->
    <script>
        // Premium Header Functionality
        // Scroll effect
        window.addEventListener('scroll', function() {
            const headerContainer = document.getElementById('headerContainer');
            if (window.scrollY > 50) {
                headerContainer.classList.add('scrolled');
            } else {
                headerContainer.classList.remove('scrolled');
            }
        });
        
        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        if (themeToggle) {
            themeToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');
                
                // Update icon
                const moonIcon = this.querySelector('.fa-moon');
                const sunIcon = this.querySelector('.fa-sun');
                
                if (document.body.classList.contains('dark-mode')) {
                    moonIcon.style.display = 'none';
                    
                    // Create sun icon if it doesn't exist
                    if (!sunIcon) {
                        const icon = document.createElement('i');
                        icon.className = 'fas fa-sun';
                        this.appendChild(icon);
                    } else {
                        sunIcon.style.display = 'block';
                    }
                    
                    localStorage.setItem('dark-theme', 'true');
                } else {
                    if (sunIcon) sunIcon.style.display = 'none';
                    moonIcon.style.display = 'block';
                    localStorage.setItem('dark-theme', 'false');
                }
            });
        }
        
        // Load saved theme
        if (localStorage.getItem('dark-theme') === 'true') {
            document.body.classList.add('dark-mode');
            
            // Add sun icon
            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle) {
                const moonIcon = themeToggle.querySelector('.fa-moon');
                if (moonIcon) moonIcon.style.display = 'none';
                
                const sunIcon = themeToggle.querySelector('.fa-sun');
                if (!sunIcon) {
                    const icon = document.createElement('i');
                    icon.className = 'fas fa-sun';
                    themeToggle.appendChild(icon);
                } else {
                    sunIcon.style.display = 'block';
                }
            }
        }
    </script>
