<!DOCTYPE html>
<html lang="en" class="dark-mode dark-theme">
<head>
    <meta name="theme-color" content="#1A3C34">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Track Your Nutrition - Nutrition Tracker</title>
    
    <!-- Footer Fix Scripts -->
    <script src="scripts/fix-header-scroll.js" defer></script>
    <script src="scripts/fix-scroll-errors.js" defer></script>
    <script src="scripts/fix-footer.js" defer></script>
    <script src="scripts/remove-spacers.js" defer></script>
    <link rel="stylesheet" href="styles/fix-scroll-smoothness.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/tracker.css">
    <link rel="stylesheet" href="styles/loading.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@300;400;500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Premium Design Theme */
        :root {
            --primary-color: #1A3C34;
            --primary-dark: #122b24;
            --secondary-color: #3D5A80;
            --background-light: #F4EDE4;
            --background-gray: #F5F5F5;
            --accent-color: #FF8C42;
            --accent-dark: #e67e3a;
            --text-primary: #1A3C34;
            --text-secondary: #5c6c68;
            --shadow-sm: 0 2px 4px rgba(26, 60, 52, 0.05);
            --shadow-md: 0 4px 6px rgba(26, 60, 52, 0.1);
            --shadow-lg: 0 10px 15px rgba(26, 60, 52, 0.1);
            --font-heading: 'Poppins', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-ui: 'Montserrat', sans-serif;
            --border-radius: 8px;
        }

        body {
            font-family: var(--font-body);
            color: var(--text-primary);
            background-color: var(--background-light);
        }

        header {
            display: none;
        }

        header .logo {
            display: none;
        }

        header nav ul li a {
            display: none;
        }

        header nav ul li a:hover {
            display: none;
        }

        header nav {
            display: none;
        }

        /* Tracker-specific updates */
        .tracker-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .tracker-container h1 {
            font-family: var(--font-heading);
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 30px;
            text-align: center;
        }

        .meal-section {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            margin-bottom: 25px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .meal-section:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        .meal-header {
            background: var(--primary-color);
            color: white;
            padding: 18px 25px;
            font-family: var(--font-heading);
        }

        .meal-header h2 {
            margin: 0;
            font-weight: 600;
            color: white;
        }

        .add-food-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            padding: 12px 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-weight: 600;
            font-family: var(--font-ui);
            transition: background-color 0.3s, transform 0.2s;
        }

        .add-food-btn:hover {
            background-color: var(--accent-dark);
            transform: translateY(-2px);
        }

        .add-food-btn i {
            margin-right: 8px;
        }

        .date-selector {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            padding: 18px;
            margin-bottom: 25px;
        }

        .summary-card {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            padding: 25px;
        }

        .progress-bar {
            height: 12px;
            background-color: var(--background-light);
            border-radius: 6px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            border-radius: 6px;
            transition: width 0.3s ease;
        }

        .food-item {
            transition: background-color 0.2s;
            padding: 15px 20px;
            border-bottom: 1px solid var(--background-light);
        }

        .food-item:hover {
            background-color: var(--background-light);
        }

        .food-actions button {
            color: var(--secondary-color);
            transition: color 0.2s;
        }

        .food-actions button:hover {
            color: var(--primary-color);
        }
        
        /* Buttons and search styles */
        .search-section {
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .search-section input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            min-width: 200px;
            font-family: var(--font-body);
        }
        
        .search-section input:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(61, 90, 128, 0.1);
        }
        
        .search-section button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            padding: 12px 24px;
            cursor: pointer;
            font-family: var(--font-ui);
            font-weight: 600;
            transition: background-color 0.3s, transform 0.2s;
        }
        
        .search-section button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }
        
        .advanced-search-btn {
            color: var(--secondary-color);
            text-decoration: none;
            padding: 12px;
            display: inline-block;
            font-family: var(--font-ui);
            font-weight: 500;
            transition: color 0.3s;
        }
        
        .advanced-search-btn:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }
        
        .meal-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .meal-btn {
            background-color: white;
            border: 1px solid var(--background-light);
            border-radius: var(--border-radius);
            padding: 12px 20px;
            cursor: pointer;
            font-family: var(--font-ui);
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .meal-btn:hover {
            background-color: var(--background-light);
            transform: translateY(-2px);
        }
        
        .meal-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .food-list h2, .nutrition-chart h2 {
            font-family: var(--font-heading);
            color: var(--primary-color);
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .daily-totals {
            background-color: white;
            border-radius: var(--border-radius);
            padding: 20px;
            margin-top: 25px;
            box-shadow: var(--shadow-sm);
        }
        
        .daily-totals h3 {
            color: var(--primary-color);
            font-family: var(--font-heading);
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .totals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .total-item {
            display: flex;
            flex-direction: column;
        }
        
        .total-label {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .total-value {
            font-weight: 600;
            font-size: 18px;
            color: var(--primary-color);
        }
        
        .macro-bar {
            height: 25px;
            display: flex;
            border-radius: var(--border-radius);
            overflow: hidden;
            margin: 15px 0;
            box-shadow: var(--shadow-sm);
        }
        
        .macro-protein {
            background-color: #4361ee; /* Original blue color for protein */
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
            font-family: var(--font-ui);
        }
        
        .macro-carbs {
            background-color: #48bfe3; /* Original light blue color for carbs */
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
            font-family: var(--font-ui);
        }
        
        .macro-fat {
            background-color: #e63946; /* Original red color for fat */
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
            font-family: var(--font-ui);
        }

        .macro-legend {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }

        .macro-item {
            display: flex;
            align-items: center;
            font-family: var(--font-body);
        }

        .macro-color {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .protein-color {
            background-color: #4361ee; /* Original blue color for protein */
        }

        .carbs-color {
            background-color: #48bfe3; /* Original light blue color for carbs */
        }

        .fat-color {
            background-color: #e63946; /* Original red color for fat */
        }

        .nutrition-chart {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            padding: 25px;
            margin-top: 30px;
        }

        .empty-state {
            padding: 30px;
            text-align: center;
            color: var(--text-secondary);
            font-style: italic;
        }

        footer {
            background-color: var(--primary-color);
            color: white;
            padding: 40px 0;
            margin-top: 60px;
            text-align: center;
        }

        footer p {
            color: white;
            margin-bottom: 15px;
        }

        .footer-links a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            margin: 0 15px;
            transition: color 0.3s;
            font-family: var(--font-ui);
        }

        .footer-links a:hover {
            color: var(--accent-color);
        }

        @media (max-width: 768px) {
            .meal-buttons {
                justify-content: center;
            }
            
            .totals-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .totals-grid {
                grid-template-columns: 1fr;
            }
            
            .macro-legend {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>

    <!-- Dark Mode Enforcer - Load First -->
    <script src="scripts/dark-mode-enforcer.js"></script>

    <!-- Gradient Scroll Effect -->
    <script src="scripts/gradient-scroll.js" defer></script>
    <link rel="stylesheet" href="styles/complete-fixes.css">
    <link rel="stylesheet" href="styles/disable-old-floating-badge.css">

    <!-- Footer Fix Styles -->
    <link rel="stylesheet" href="styles/footer-elite-luxury.css">
        <link rel="stylesheet" href="styles/cleanup-scrolling.css">
    <link rel="stylesheet" href="styles/screenshot-fix.css">
</head>
<body class="dark-theme gradient-background dark-mode">
    <main class="main-content">
        <h1>Track Your Nutrition</h1>
        
        <div class="search-section">
            <input type="text" id="food-search" placeholder="Search for food...">
            <button id="search-btn">Search</button>
            <a href="food-search.html" class="advanced-search-btn">Advanced Search</a>
        </div>
        
        <div class="meal-buttons">
            <button class="meal-btn active" data-meal="breakfast">Breakfast</button>
            <button class="meal-btn" data-meal="lunch">Lunch</button>
            <button class="meal-btn" data-meal="dinner">Dinner</button>
            <button class="meal-btn" data-meal="snacks">Snacks</button>
        </div>
        
        <div class="food-list">
            <h2>Today's Food Log</h2>
            <div id="food-entries">
                <!-- Food entries will be added here by JavaScript -->
                <p class="empty-state">No foods logged yet today. Use the search bar above to add foods.</p>
            </div>
            
            <div class="daily-totals">
                <h3>Daily Totals</h3>
                <div class="totals-grid">
                    <div class="total-item">
                        <span class="total-label">Calories:</span>
                        <span id="total-calories" class="total-value">0</span>
                    </div>
                    <div class="total-item">
                        <span class="total-label">Protein:</span>
                        <span id="total-protein" class="total-value">0g</span>
                    </div>
                    <div class="total-item">
                        <span class="total-label">Carbs:</span>
                        <span id="total-carbs" class="total-value">0g</span>
                    </div>
                    <div class="total-item">
                        <span class="total-label">Fat:</span>
                        <span id="total-fat" class="total-value">0g</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="nutrition-chart">
            <h2>Macronutrient Breakdown</h2>
            <div class="macro-breakdown">
                <div class="macro-bar">
                    <div class="macro-protein" style="width: 30%;">Protein</div>
                    <div class="macro-carbs" style="width: 40%;">Carbs</div>
                    <div class="macro-fat" style="width: 30%;">Fat</div>
                </div>
                <div class="macro-legend">
                    <div class="macro-item">
                        <div class="macro-color protein-color"></div>
                        <span>Protein</span>
                    </div>
                    <div class="macro-item">
                        <div class="macro-color carbs-color"></div>
                        <span>Carbs</span>
                    </div>
                    <div class="macro-item">
                        <div class="macro-color fat-color"></div>
                        <span>Fat</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="scripts/tracker.js"></script>
    <script src="scripts/footer.js"></script>
    <div id="sidebar-container"></div>
    <script src="components/inject-sidebar.js"></script>
    <script src="scripts/screenshot-mode.js"></script>
    <script src="scripts/microsoft-screenshot-fix.js"></script>
</body>
</html>
