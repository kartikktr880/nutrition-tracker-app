    <!-- Firebase SDK -->
    <script type="module">
        import { 
            initAuthHandler, 
            signInWithGoogle, 
            signInWithFacebook,
            loginWithEmail,
            resetPassword
        } from './scripts/auth-core.js';

        // Initialize auth handler
        document.addEventListener('DOMContentLoaded', function() {
            initAuthHandler();
        });

        // Make functions available globally
        window.handleGoogleSignIn = async function() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            const errorMessage = document.getElementById('error-message');
            
            try {
                loadingOverlay.style.display = 'flex';
                errorMessage.style.display = 'none';
                const result = await signInWithGoogle();
                if (!result.success) {
                    throw new Error(result.error);
                }
            } catch (error) {
                console.error('Google sign-in error:', error);
                errorMessage.textContent = getErrorMessage(error);
                errorMessage.style.display = 'block';
            } finally {
                loadingOverlay.style.display = 'none';
            }
        };

        window.handleFacebookSignIn = async function() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            const errorMessage = document.getElementById('error-message');
            
            try {
                loadingOverlay.style.display = 'flex';
                errorMessage.style.display = 'none';
                const result = await signInWithFacebook();
                if (!result.success) {
                    throw new Error(result.error);
                }
            } catch (error) {
                console.error('Facebook sign-in error:', error);
                errorMessage.textContent = getErrorMessage(error);
                errorMessage.style.display = 'block';
            } finally {
                loadingOverlay.style.display = 'none';
            }
        };

        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loadingOverlay = document.getElementById('loadingOverlay');
            const errorMessage = document.getElementById('error-message');
            
            try {
                loadingOverlay.style.display = 'flex';
                errorMessage.style.display = 'none';
                const result = await loginWithEmail(email, password);
                if (!result.success) {
                    throw new Error(result.error);
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = getErrorMessage(error);
                errorMessage.style.display = 'block';
            } finally {
                loadingOverlay.style.display = 'none';
            }
        });

        // Handle forgot password
        document.getElementById('forgotPasswordLink').addEventListener('click', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const errorMessage = document.getElementById('error-message');
            
            if (!email) {
                errorMessage.textContent = 'Please enter your email address first.';
                errorMessage.style.display = 'block';
                return;
            }
            
            try {
                errorMessage.style.display = 'none';
                const result = await resetPassword(email);
                if (!result.success) {
                    throw new Error(result.error);
                }
                errorMessage.textContent = 'Password reset email sent! Please check your inbox.';
                errorMessage.style.display = 'block';
                errorMessage.style.color = '#28a745';
                errorMessage.style.backgroundColor = 'rgba(40, 167, 69, 0.1)';
            } catch (error) {
                console.error('Password reset error:', error);
                errorMessage.textContent = getErrorMessage(error);
                errorMessage.style.display = 'block';
                errorMessage.style.color = '#dc3545';
                errorMessage.style.backgroundColor = 'rgba(220, 53, 69, 0.1)';
            }
        });

        function getErrorMessage(error) {
            switch (error.code) {
                case 'auth/popup-closed-by-user':
                    return 'Sign-in was cancelled.';
                case 'auth/popup-blocked':
                    return 'Pop-up was blocked by your browser. Please allow pop-ups for this site.';
                case 'auth/account-exists-with-different-credential':
                    return 'An account already exists with the same email address but different sign-in credentials.';
                case 'auth/cancelled-popup-request':
                    return 'Only one pop-up request is allowed at a time.';
                case 'auth/operation-not-allowed':
                    return 'This sign-in method is not enabled. Please contact support.';
                case 'auth/operation-not-supported-in-this-environment':
                    return 'This operation is not supported in your current environment.';
                case 'auth/user-not-found':
                case 'auth/wrong-password':
                    return 'Invalid email or password.';
                case 'auth/invalid-email':
                    return 'Invalid email address.';
                case 'auth/too-many-requests':
                    return 'Too many failed attempts. Please try again later.';
                default:
                    return error.message || 'An error occurred. Please try again.';
            }
        }
    </script>
