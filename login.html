<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Nutrition Tracker</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@300;400;500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Premium Design Theme */
        :root {
            --primary-color: #1A3C34;
            --primary-dark: #122b24;
            --secondary-color: #3D5A80;
            --background-light: #F4EDE4;
            --background-gray: #F5F5F5;
            --accent-color: #FF8C42;
            --accent-dark: #e67e3a;
            --text-primary: #1A3C34;
            --text-secondary: #5c6c68;
            --shadow-sm: 0 2px 4px rgba(26, 60, 52, 0.05);
            --shadow-md: 0 4px 6px rgba(26, 60, 52, 0.1);
            --shadow-lg: 0 10px 15px rgba(26, 60, 52, 0.1);
            --font-heading: 'Poppins', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-ui: 'Montserrat', sans-serif;
            --border-radius: 8px;
        }

        body {
            font-family: var(--font-body);
            color: var(--text-primary);
            background-color: var(--background-light);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: white;
            box-shadow: var(--shadow-md);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header .logo {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 1.5rem;
            font-family: var(--font-heading);
            text-decoration: none;
        }

        header nav ul {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        header nav ul li {
            margin-left: 20px;
        }

        header nav ul li a {
            color: var(--text-primary);
            font-weight: 500;
            transition: color 0.3s;
            font-family: var(--font-ui);
            text-decoration: none;
        }

        header nav ul li a:hover {
            color: var(--secondary-color);
        }

        .auth-container {
            max-width: 450px;
            margin: 50px auto;
            padding: 40px;
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            flex: 1;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            font-family: var(--font-heading);
            color: var(--primary-color);
            font-size: 2rem;
            margin: 0 0 10px 0;
        }

        .auth-header p {
            font-family: var(--font-body);
            color: var(--text-secondary);
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-family: var(--font-ui);
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-family: var(--font-body);
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
        }

        .form-control:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(61, 90, 128, 0.1);
            outline: none;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 15px;
            width: 100%;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
            font-family: var(--font-ui);
        }

        .btn:hover {
            background-color: var(--accent-dark);
            transform: translateY(-2px);
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            font-family: var(--font-body);
            color: var(--text-secondary);
        }

        .auth-footer a {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .auth-footer a:hover {
            color: var(--primary-color);
            text-decoration: underline;
        }

        .social-login {
            margin-top: 30px;
            text-align: center;
        }

        .social-login p {
            font-family: var(--font-body);
            color: var(--text-secondary);
            margin-bottom: 15px;
            position: relative;
        }

        .social-login p::before,
        .social-login p::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 35%;
            height: 1px;
            background-color: #ddd;
        }

        .social-login p::before {
            left: 0;
        }

        .social-login p::after {
            right: 0;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .social-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            width: 130px;
            border-radius: var(--border-radius);
            border: 1px solid #ddd;
            background-color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-ui);
            font-weight: 500;
            color: #444;
            box-shadow: var(--shadow-sm);
        }

        .social-button:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .social-button.google {
            border-color: #4285F4;
        }

        .social-button.google i {
            color: #4285F4;
        }

        .social-button.facebook {
            border-color: #3b5998;
        }

        .social-button.facebook i {
            color: #3b5998;
        }

        .social-button i {
            margin-right: 10px;
            font-size: 1.1rem;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: var(--secondary-color);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .forgot-password a:hover {
            color: var(--primary-color);
            text-decoration: underline;
        }

        .error-message {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 5px;
            font-family: var(--font-body);
            display: none;
        }

        /* Loading spinner */
        .loading-spinner {
            display: none;
            margin: 0 auto;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 140, 66, 0.2);
            border-radius: 50%;
            border-top-color: var(--accent-color);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Success message */
        .success-message {
            display: none;
            color: #27ae60;
            font-size: 0.9rem;
            margin-top: 5px;
            font-family: var(--font-body);
            text-align: center;
            padding: 8px;
            background-color: rgba(39, 174, 96, 0.1);
            border-radius: var(--border-radius);
        }

        /* Button disabled state */
        .btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        footer {
            background-color: var(--primary-color);
            color: white;
            padding: 20px 0;
            text-align: center;
            width: 100%;
            margin-top: 40px;
        }

        footer p {
            margin: 0;
            font-family: var(--font-body);
        }

        .footer-links {
            margin-top: 15px;
        }

        .footer-links a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            margin: 0 15px;
            transition: color 0.3s;
            font-family: var(--font-ui);
        }

        .footer-links a:hover {
            color: var(--accent-color);
        }

        @media (max-width: 768px) {
            .auth-container {
                margin: 30px 20px;
                padding: 30px 20px;
            }
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading-overlay .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent-color);
            animation: spin 1s ease-in-out infinite;
        }

        /* Error message for social login */
        #errorMessage {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 15px;
            font-family: var(--font-body);
            display: none;
            text-align: center;
            padding: 8px;
            background-color: rgba(231, 76, 60, 0.1);
            border-radius: var(--border-radius);
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Nutrition Tracker</a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <main class="auth-container">
        <div class="auth-header">
            <h1>Welcome Back</h1>
            <p>Login to access your nutrition dashboard</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" required>
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input-container" style="position: relative;">
                    <input type="password" id="password" class="form-control" required>
                    <button type="button" id="togglePassword" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; z-index: 10;" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="error-message" id="passwordError"></div>
            </div>

            <div class="forgot-password">
                <a href="#" id="forgotPasswordLink">Forgot Password?</a>
            </div>

            <button type="submit" class="btn" id="loginButton">Login</button>
            <div class="loading-spinner" id="loadingSpinner"></div>
            <div class="success-message" id="successMessage"></div>
        </form>

        <div class="social-login">
            <p>Or login with</p>
            <div class="social-buttons">
                <button class="social-button google" id="googleSignIn">
                    <i class="fab fa-google"></i> Google
                </button>
                <button class="social-button facebook" id="facebookSignIn">
                    <i class="fab fa-facebook-f"></i> Facebook
                </button>
            </div>
            <div id="errorMessage"></div>
        </div>

        <div class="auth-footer">
            Don't have an account? <a href="signup.html">Sign up</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Nutrition Tracker. All rights reserved.</p>
        <div class="footer-links">
            <a href="about.html">About Us</a>
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Service</a>
            <a href="contact.html">Contact Us</a>
        </div>
    </footer>

    <script src="scripts/firebase-config.js"></script>
    <script src="scripts/unified-auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            try {
                // Use global auth object instead of import
                console.log("Authentication module loaded successfully");
                
                // Setup password toggle
                setupPasswordToggle();
                
                // Setup form handlers
                setupFormHandlers(window.auth);
                
                // Setup social login buttons
                setupSocialLogin(window.auth);
                
            } catch (error) {
                console.error("Error initializing:", error);
                showError('errorMessage', 'Failed to initialize authentication. Please refresh the page and try again.');
            }
        });
        
        // Setup password toggle function
        function setupPasswordToggle() {
            const togglePassword = document.getElementById('togglePassword');
            const password = document.getElementById('password');
            
            if (togglePassword && password) {
                togglePassword.addEventListener('click', function(e) {
                    e.preventDefault(); // Prevent any form submission
                    
                    // Toggle password visibility
                    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                    password.setAttribute('type', type);
                    
                    // Toggle icon
                    const icon = this.querySelector('i');
                    icon.classList.toggle('fa-eye');
                    icon.classList.toggle('fa-eye-slash');
                });
            }
        }
        
        // Setup form handlers
        function setupFormHandlers(auth) {
            // Login form submission
            const loginForm = document.getElementById('loginForm');
            
            if (loginForm) {
                loginForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    clearErrors();
                    
                    // Get form values
                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value;
                    
                    // Validate form
                    let isValid = true;
                    
                    // Validate email
                    if (!email) {
                        showError('emailError', 'Please enter your email');
                        isValid = false;
                    } else if (!validateEmailFormat(email)) {
                        showError('emailError', 'Please enter a valid email address');
                        isValid = false;
                    }
                    
                    // Validate password
                    if (!password) {
                        showError('passwordError', 'Please enter your password');
                        isValid = false;
                    }
                    
                    if (!isValid) return;
                    
                    // Show loading state
                    const loginButton = document.getElementById('loginButton');
                    const loadingSpinner = document.getElementById('loadingSpinner');
                    loginButton.disabled = true;
                    loadingSpinner.style.display = 'block';
                    
                    try {
                        // Call login function that checks if user exists
                        const result = await auth.loginWithEmail(email, password);
                        
                        if (result.success) {
                            // Redirect to dashboard
                            window.location.href = 'dashboard.html';
                        } else {
                            // Check if user doesn't exist
                            if (!result.userExists) {
                                // Show popup and redirect to signup
                                showUserNotExistModal(email);
                            } else {
                                // Handle other login errors
                                handleLoginError(result.error);
                            }
                        }
                    } catch (error) {
                        console.error('Login error:', error);
                        handleLoginError(error);
                    } finally {
                        // Reset UI
                        loginButton.disabled = false;
                        loadingSpinner.style.display = 'none';
                    }
                });
            }
            
            // Forgot password link
            const forgotPasswordLink = document.getElementById('forgotPasswordLink');
            
            if (forgotPasswordLink) {
                forgotPasswordLink.addEventListener('click', async function(e) {
                    e.preventDefault();
                    clearErrors();
                    
                    // Get email
                    const email = document.getElementById('email').value.trim();
                    
                    // Validate email
                    if (!email) {
                        showError('emailError', 'Please enter your email to reset password');
                        return;
                    } else if (!validateEmailFormat(email)) {
                        showError('emailError', 'Please enter a valid email address');
                        return;
                    }
                    
                    // Show loading state
                    const loginButton = document.getElementById('loginButton');
                    const loadingSpinner = document.getElementById('loadingSpinner');
                    loginButton.disabled = true;
                    loadingSpinner.style.display = 'block';
                    
                    try {
                        // Send password reset email (function now checks if user exists)
                        const result = await auth.resetPassword(email);
                        
                        if (result.success) {
                            // Show success message
                            document.getElementById('successMessage').textContent = 'Password reset email sent! Please check your inbox.';
                            document.getElementById('successMessage').style.display = 'block';
                        } else {
                            // Handle error
                            handleLoginError(result.error, 'reset');
                        }
                    } catch (error) {
                        console.error('Password reset error:', error);
                        handleLoginError(error, 'reset');
                    } finally {
                        // Hide loading state
                        loginButton.disabled = false;
                        loadingSpinner.style.display = 'none';
                    }
                });
            }
        }
        
        // Setup social login
        function setupSocialLogin(auth) {
            // Google login
            document.getElementById('googleSignIn').addEventListener('click', async function() {
                clearErrors();
                document.getElementById('loadingOverlay').style.display = 'flex';
                
                try {
                    // Login with Google
                    const result = await auth.signInWithGoogle();
                    
                    if (result.success) {
                        // Redirect to dashboard
                        window.location.href = 'dashboard.html';
                    } else {
                        // Handle error
                        document.getElementById('loadingOverlay').style.display = 'none';
                        handleSocialError(result.error, 'Google');
                    }
                } catch (error) {
                    console.error('Google login error:', error);
                    document.getElementById('loadingOverlay').style.display = 'none';
                    handleSocialError(error, 'Google');
                }
            });
            
            // Facebook login
            document.getElementById('facebookSignIn').addEventListener('click', async function() {
                clearErrors();
                document.getElementById('loadingOverlay').style.display = 'flex';
                
                try {
                    // Login with Facebook
                    const result = await auth.signInWithFacebook();
                    
                    if (result.success) {
                        // Redirect to dashboard
                        window.location.href = 'dashboard.html';
                    } else {
                        // Handle error
                        document.getElementById('loadingOverlay').style.display = 'none';
                        handleSocialError(result.error, 'Facebook');
                    }
                } catch (error) {
                    console.error('Facebook login error:', error);
                    document.getElementById('loadingOverlay').style.display = 'none';
                    handleSocialError(error, 'Facebook');
                }
            });
        }
        
        // Handle login errors
        function handleLoginError(error, type = 'login') {
            let message = '';
            let target = 'passwordError';
            
            if (error.code === 'auth/user-not-found') {
                message = 'No account found with this email address.';
                target = 'emailError';
            } else if (error.code === 'auth/wrong-password') {
                message = 'Incorrect password. Please try again.';
            } else if (error.code === 'auth/invalid-email') {
                message = 'Invalid email format.';
                target = 'emailError';
            } else if (error.code === 'auth/too-many-requests') {
                message = 'Too many failed login attempts. Please try again later.';
            } else if (error.code === 'auth/network-request-failed') {
                message = 'Network error. Please check your internet connection.';
            } else if (type === 'reset') {
                message = 'Failed to send password reset email. ' + (error.message || 'Please try again.');
                target = 'emailError';
            } else {
                message = 'Login failed. ' + (error.message || 'Please try again.');
            }
            
            showError(target, message);
        }
        
        // Handle social login errors
        function handleSocialError(error, provider) {
            let message = `Error signing in with ${provider}: `;
            
            if (error.code === 'auth/popup-closed-by-user') {
                message += 'Sign-in popup was closed.';
            } else if (error.code === 'auth/popup-blocked') {
                message += 'Sign-in popup was blocked by your browser. Please enable popups for this site.';
            } else if (error.code === 'auth/unauthorized-domain') {
                message += `This domain (${window.location.hostname}) is not authorized for Firebase authentication. Please contact the site administrator.`;
            } else if (error.code === 'auth/cancelled-popup-request') {
                message += 'Multiple popup requests were triggered. Please try again.';
            } else if (error.code === 'auth/network-request-failed') {
                message += 'Network error. Please check your internet connection.';
            } else {
                message += error.message || 'An unknown error occurred.';
            }
            
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.style.display = 'block';

            // Add special instructions for unauthorized domain error
            if (error.code === 'auth/unauthorized-domain') {
                // Create detailed instructions
                const instructions = document.createElement('div');
                instructions.innerHTML = `
                    <div style="margin-top: 10px; text-align: left; padding: 15px; background-color: #f8f9fa; border-radius: 8px; font-size: 0.9rem;">
                        <p><strong>Site Owner Instructions:</strong></p>
                        <ol style="margin-left: 20px; padding-left: 0;">
                            <li>Go to <a href="https://console.firebase.google.com/" target="_blank">Firebase Console</a></li>
                            <li>Select your project (nutrition-tracking-c98bd)</li>
                            <li>Click on "Authentication" in the left menu</li>
                            <li>Go to the "Settings" tab</li>
                            <li>Scroll to "Authorized domains"</li>
                            <li>Add: "${window.location.hostname}"</li>
                        </ol>
                    </div>
                `;
                
                errorElement.appendChild(instructions);
            }
        }
        
        // Function to show user not exist modal and redirect
        function showUserNotExistModal(email) {
            // Create modal for user not exist
            const modal = document.createElement('div');
            modal.className = 'user-not-exist-modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h2>Account Not Found</h2>
                    <p>We couldn't find an account with the email <strong>${email}</strong></p>
                    <p>Would you like to create a new account?</p>
                    <div class="modal-buttons">
                        <button id="cancelBtn" class="btn-secondary">Cancel</button>
                        <button id="createAccountBtn" class="btn-primary">Create Account</button>
                    </div>
                </div>
            `;
            
            // Add styles for the modal
            const style = document.createElement('style');
            style.innerHTML = `
                .user-not-exist-modal {
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background-color: rgba(0, 0, 0, 0.5);
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    z-index: 1000;
                }
                
                .modal-content {
                    background-color: white;
                    padding: 30px;
                    border-radius: var(--border-radius);
                    max-width: 400px;
                    width: 90%;
                    box-shadow: var(--shadow-lg);
                    text-align: center;
                }
                
                .modal-content h2 {
                    color: var(--primary-color);
                    margin-top: 0;
                    font-family: var(--font-heading);
                }
                
                .modal-content p {
                    color: var(--text-secondary);
                    margin-bottom: 20px;
                    font-family: var(--font-body);
                }
                
                .modal-buttons {
                    display: flex;
                    justify-content: space-between;
                    gap: 15px;
                }
                
                .btn-primary {
                    background-color: var(--accent-color);
                    color: white;
                    border: none;
                    padding: 12px 20px;
                    border-radius: var(--border-radius);
                    cursor: pointer;
                    flex: 1;
                    font-family: var(--font-ui);
                    font-weight: 500;
                    transition: background-color 0.3s, transform 0.2s;
                }
                
                .btn-primary:hover {
                    background-color: var(--accent-dark);
                    transform: translateY(-2px);
                }
                
                .btn-secondary {
                    background-color: #f5f5f5;
                    color: var(--text-primary);
                    border: 1px solid #ddd;
                    padding: 12px 20px;
                    border-radius: var(--border-radius);
                    cursor: pointer;
                    flex: 1;
                    font-family: var(--font-ui);
                    font-weight: 500;
                    transition: background-color 0.3s, transform 0.2s;
                }
                
                .btn-secondary:hover {
                    background-color: #e5e5e5;
                    transform: translateY(-2px);
                }
            `;
            
            document.head.appendChild(style);
            document.body.appendChild(modal);
            
            // Add event listeners
            document.getElementById('cancelBtn').addEventListener('click', function() {
                document.body.removeChild(modal);
            });
            
            document.getElementById('createAccountBtn').addEventListener('click', function() {
                // Redirect to signup page with email pre-filled
                window.location.href = `signup.html?email=${encodeURIComponent(email)}`;
            });
        }
        
        // Validate email format
        function validateEmailFormat(email) {
            const re = /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
            return re.test(String(email).toLowerCase());
        }
        
        // Show error message
        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }
        
        // Clear all error messages
        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.style.display = 'none';
                el.textContent = '';
            });
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }
    </script>
</body>
</html>
