    <style>
        /* Premium Design Theme */
        :root {
            --primary-color: #1A3C34;
            --primary-dark: #122b24;
            --secondary-color: #3D5A80;
            --background-light: #F4EDE4;
            --background-gray: #F5F5F5;
            --accent-color: #FF8C42;
            --accent-dark: #e67e3a;
            --text-primary: #1A3C34;
            --text-secondary: #5c6c68;
            --shadow-sm: 0 2px 4px rgba(26, 60, 52, 0.05);
            --shadow-md: 0 4px 6px rgba(26, 60, 52, 0.1);
            --shadow-lg: 0 10px 15px rgba(26, 60, 52, 0.1);
            --font-heading: 'Poppins', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-ui: 'Montserrat', sans-serif;
            --border-radius: 8px;
        }

        body {
            font-family: var(--font-body);
            color: var(--text-primary);
            background-color: var(--background-light);
        }

        header {
            background-color: white;
            box-shadow: var(--shadow-md);
            padding: 15px 20px;
        }

        header .logo {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 1.5rem;
            font-family: var(--font-heading);
        }

        header nav ul li a {
            color: var(--text-primary);
            font-weight: 500;
            transition: color 0.3s;
            font-family: var(--font-ui);
        }

        header nav ul li a:hover {
            color: var(--secondary-color);
        }

        /* Profile specific styles */
        .profile-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .profile-container h1 {
            font-family: var(--font-heading);
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 30px;
            text-align: center;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 35px;
            margin-top: 30px;
        }

        .profile-section {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            padding: 30px;
            margin-bottom: 25px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .profile-section:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .profile-section h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--background-light);
            padding-bottom: 15px;
            margin-top: 0;
            margin-bottom: 25px;
            font-family: var(--font-heading);
            font-weight: 600;
        }

        .profile-picture-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .profile-picture {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            box-shadow: var(--shadow-md);
            border: 4px solid white;
        }

        .profile-picture img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .picture-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            text-align: center;
            padding: 10px 0;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .profile-picture:hover .picture-overlay {
            opacity: 1;
        }

        .upload-btn {
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: var(--font-ui);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
            font-family: var(--font-ui);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--background-light);
            border-radius: var(--border-radius);
            font-size: 16px;
            font-family: var(--font-body);
            transition: border-color 0.3s, box-shadow 0.3s;
            background-color: white;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--secondary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(61, 90, 128, 0.1);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            padding: 14px 28px;
            font-weight: 600;
            font-family: var(--font-ui);
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            display: inline-block;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-3px);
        }

        .nutrition-goal {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--background-light);
        }

        .nutrition-goal:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .goal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .goal-header h3 {
            margin: 0;
            color: var(--text-primary);
            font-weight: 600;
            font-family: var(--font-heading);
        }

        .goal-header .edit-btn {
            background-color: transparent;
            color: var(--secondary-color);
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-family: var(--font-ui);
            display: flex;
            align-items: center;
            transition: color 0.3s, transform 0.2s;
        }

        .goal-header .edit-btn:hover {
            color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .goal-header .edit-btn i {
            margin-right: 6px;
        }

        .goal-progress {
            height: 12px;
            background-color: var(--background-light);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .goal-progress-bar {
            height: 100%;
            background: linear-gradient(to right, var(--secondary-color), var(--primary-color));
            border-radius: 6px;
            width: 75%; /* Example value, should be dynamic */
        }

        .goal-details {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: var(--text-secondary);
            font-family: var(--font-body);
        }

        .save-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            padding: 14px 28px;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font-ui);
            transition: background-color 0.3s, transform 0.2s;
            display: inline-block;
            margin-top: 10px;
        }

        .save-btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-3px);
        }

        footer {
            background-color: var(--primary-color);
            color: white;
            padding: 40px 0;
            margin-top: 60px;
            text-align: center;
        }

        footer p {
            color: white;
            margin-bottom: 15px;
        }

        .footer-links a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            margin: 0 15px;
            transition: color 0.3s;
            font-family: var(--font-ui);
        }

        .footer-links a:hover {
            color: var(--accent-color);
        }

        @media (max-width: 768px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Add these styles for user menu */
        .user-menu {
            display: flex;
            align-items: center;
        }

        .user-name {
            color: var(--primary-color);
            font-weight: 600;
            margin-right: 15px;
            font-family: var(--font-ui);
        }

        header nav ul li .user-menu a {
            color: var(--secondary-color);
            text-decoration: none;
            transition: color 0.3s;
        }

        header nav ul li .user-menu a:hover {
            color: var(--accent-color);
        }

        @media (max-width: 768px) {
            .user-menu {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .user-name {
                margin-right: 0;
                margin-bottom: 5px;
            }
        }
    </style>

<body class="dark-theme gradient-background dark-mode">
    <!-- Premium Desktop Header -->
    <header class="premium-header" id="premium-header">
      <div class="premium-header-container">
        <!-- Logo -->
        <a href="/" class="premium-header-logo">
          <img src="images/logo.svg" alt="NutriTrack Logo" class="premium-header-logo-img">
          <span class="premium-header-logo-text">NutriTrack</span>
        </a>

    <main class="profile-container">
        <h1>Your Profile</h1>

        <div class="profile-grid">
            <!-- Basic Information Section -->
            <section class="profile-section">
                <h2>Basic Information</h2>
                <form id="basic-info-form" class="profile-form">
                    <div class="profile-picture-container">
                        <div class="profile-picture">
                            <img id="profile-image" src="images/default-profile.png" alt="Profile Picture">
                            <div class="picture-overlay">
                                <label for="profile-picture-upload" class="upload-btn">Change Picture</label>
                                <input type="file" id="profile-picture-upload" accept="image/*" hidden>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="display-name">Display Name</label>
                        <input type="text" id="display-name" name="displayName" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" readonly>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="birthdate">Birth Date</label>
                            <input type="date" id="birthdate" name="birthdate">
                        </div>
                        <div class="form-group">
                            <label for="gender">Gender</label>
                            <select id="gender" name="gender">
                                <option value="">Select...</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                                <option value="prefer-not">Prefer not to say</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="save-btn">Save Basic Info</button>
                </form>
            </section>

            <!-- Physical Information Section -->
            <section class="profile-section">
                <h2>Physical Information</h2>
                <form id="physical-info-form" class="profile-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="height">Height</label>
                            <div class="input-with-unit">
                                <input type="number" id="height" name="height" step="0.01" min="0">
                                <select id="height-unit">
                                    <option value="cm">cm</option>
                                    <option value="ft">ft</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="weight">Weight</label>
                            <div class="input-with-unit">
                                <input type="number" id="weight" name="weight" step="0.1" min="0">
                                <select id="weight-unit">
                                    <option value="kg">kg</option>
                                    <option value="lbs">lbs</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="activity-level">Activity Level</label>
                        <select id="activity-level" name="activityLevel">
                            <option value="sedentary">Sedentary (little or no exercise)</option>
                            <option value="light">Lightly active (light exercise 1-3 days/week)</option>
                            <option value="moderate">Moderately active (moderate exercise 3-5 days/week)</option>
                            <option value="very">Very active (hard exercise 6-7 days/week)</option>
                            <option value="extra">Extra active (very hard exercise & physical job)</option>
                        </select>
                    </div>

                    <button type="submit" class="save-btn">Save Physical Info</button>
                </form>
            </section>

            <!-- Goals Section -->
            <section class="profile-section">
                <h2>Nutrition Goals</h2>
                <form id="goals-form" class="profile-form">
                    <div class="form-group">
                        <label for="goal-type">Primary Goal</label>
                        <select id="goal-type" name="goalType">
                            <option value="maintain">Maintain Weight</option>
                            <option value="lose">Lose Weight</option>
                            <option value="gain">Gain Weight</option>
                            <option value="muscle">Build Muscle</option>
                            <option value="health">Improve Health</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="target-weight">Target Weight</label>
                            <div class="input-with-unit">
                                <input type="number" id="target-weight" name="targetWeight" step="0.1" min="0">
                                <span class="unit-label">kg</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="weekly-goal">Weekly Goal</label>
                            <select id="weekly-goal" name="weeklyGoal">
                                <option value="0.25">0.25 kg per week</option>
                                <option value="0.5">0.5 kg per week</option>
                                <option value="0.75">0.75 kg per week</option>
                                <option value="1">1 kg per week</option>
                            </select>
                        </div>
                    </div>

                    <div class="macro-goals">
                        <h3>Macro Goals</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="protein-goal">Protein (%)</label>
                                <input type="number" id="protein-goal" name="proteinGoal" min="0" max="100" value="30">
                            </div>
                            <div class="form-group">
                                <label for="carbs-goal">Carbs (%)</label>
                                <input type="number" id="carbs-goal" name="carbsGoal" min="0" max="100" value="40">
                            </div>
                            <div class="form-group">
                                <label for="fat-goal">Fat (%)</label>
                                <input type="number" id="fat-goal" name="fatGoal" min="0" max="100" value="30">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="save-btn">Save Goals</button>
                </form>
            </section>

            <!-- Preferences Section -->
            <section class="profile-section">
                <h2>Preferences</h2>
                <form id="preferences-form" class="profile-form">
                    <div class="form-group">
                        <label for="measurement-system">Measurement System</label>
                        <select id="measurement-system" name="measurementSystem">
                            <option value="metric">Metric (kg, cm)</option>
                            <option value="imperial">Imperial (lbs, ft)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Dietary Preferences</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" name="dietary" value="vegetarian">
                                Vegetarian
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="dietary" value="vegan">
                                Vegan
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="dietary" value="gluten-free">
                                Gluten-Free
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="dietary" value="dairy-free">
                                Dairy-Free
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="dietary" value="keto">
                                Keto
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="dietary" value="paleo">
                                Paleo
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Food Allergies</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" name="allergies" value="nuts">
                                Nuts
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="allergies" value="dairy">
                                Dairy
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="allergies" value="eggs">
                                Eggs
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="allergies" value="soy">
                                Soy
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="allergies" value="shellfish">
                                Shellfish
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="allergies" value="wheat">
                                Wheat
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Notification Preferences</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" name="notifications" value="meal-reminders">
                                Meal Reminders
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="notifications" value="progress-updates">
                                Progress Updates
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="notifications" value="tips">
                                Nutrition Tips
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="save-btn">Save Preferences</button>
                </form>
            </section>
        </div>
    </main>

    <div id="footer-container"></div>
