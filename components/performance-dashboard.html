<!-- Performance Dashboard Component -->
<div class="performance-dashboard">
    <div class="dashboard-header">
        <h2>Performance Dashboard</h2>
        <div class="dashboard-controls">
            <button class="btn-refresh" onclick="performanceDashboard.refresh()">Refresh</button>
            <button class="btn-export" onclick="performanceDashboard.exportReport()">Export Report</button>
            <button class="btn-analytics" onclick="toggleAnalytics()">Toggle Analytics</button>
        </div>
    </div>
    
    <div class="dashboard-content">
        <div class="metrics-visualization">
            <div id="performance-chart" class="chart-container"></div>
            <div id="analytics-chart" class="chart-container" style="display: none;"></div>
        </div>
        
        <div class="metrics-summary">
            <div class="metric-card">
                <h3>FPS</h3>
                <div class="metric-value" id="fps-value">--</div>
                <div class="metric-trend" id="fps-trend"></div>
                <div class="metric-prediction" id="fps-prediction"></div>
            </div>
            
            <div class="metric-card">
                <h3>Memory</h3>
                <div class="metric-value" id="memory-value">--</div>
                <div class="metric-trend" id="memory-trend"></div>
                <div class="metric-prediction" id="memory-prediction"></div>
            </div>
            
            <div class="metric-card">
                <h3>Animations</h3>
                <div class="metric-value" id="animations-value">--</div>
                <div class="metric-trend" id="animations-trend"></div>
                <div class="metric-prediction" id="animations-prediction"></div>
            </div>
        </div>
        
        <div class="performance-issues">
            <h3>Performance Issues</h3>
            <div id="issues-list" class="issues-list"></div>
        </div>
        
        <div class="recommendations">
            <h3>Recommendations</h3>
            <div id="recommendations-list" class="recommendations-list"></div>
        </div>

        <div class="correlations">
            <h3>Metric Correlations</h3>
            <div id="correlations-list" class="correlations-list"></div>
        </div>

        <div class="patterns">
            <h3>Detected Patterns</h3>
            <div id="patterns-list" class="patterns-list"></div>
        </div>
    </div>
</div>

<style>
.performance-dashboard {
    background: #1E1E1E;
    color: #FFFFFF;
    border-radius: 8px;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
}

.dashboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.dashboard-header h2 {
    margin: 0;
    font-size: 24px;
    font-weight: 600;
}

.dashboard-controls {
    display: flex;
    gap: 10px;
}

.dashboard-controls button {
    padding: 8px 16px;
    border: none;
    border-radius: 4px;
    background: #2196F3;
    color: white;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.2s;
}

.dashboard-controls button:hover {
    background: #1976D2;
}

.chart-container {
    background: #2D2D2D;
    border-radius: 4px;
    height: 300px;
    margin-bottom: 20px;
}

.metrics-summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 20px;
}

.metric-card {
    background: #2D2D2D;
    border-radius: 4px;
    padding: 15px;
}

.metric-card h3 {
    margin: 0 0 10px 0;
    font-size: 16px;
    font-weight: 500;
    color: #B0B0B0;
}

.metric-value {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 5px;
}

.metric-trend {
    font-size: 14px;
    color: #B0B0B0;
    margin-bottom: 5px;
}

.metric-prediction {
    font-size: 12px;
    color: #81C784;
    font-style: italic;
}

.performance-issues,
.recommendations,
.correlations,
.patterns {
    background: #2D2D2D;
    border-radius: 4px;
    padding: 15px;
    margin-bottom: 20px;
}

.performance-issues h3,
.recommendations h3,
.correlations h3,
.patterns h3 {
    margin: 0 0 10px 0;
    font-size: 16px;
    font-weight: 500;
    color: #B0B0B0;
}

.issues-list,
.recommendations-list,
.correlations-list,
.patterns-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.issue-item,
.recommendation-item,
.correlation-item,
.pattern-item {
    padding: 10px;
    border-radius: 4px;
    font-size: 14px;
}

.issue-item {
    background: rgba(244, 67, 54, 0.1);
    border-left: 3px solid #F44336;
}

.recommendation-item {
    background: rgba(33, 150, 243, 0.1);
    border-left: 3px solid #2196F3;
}

.correlation-item {
    background: rgba(156, 39, 176, 0.1);
    border-left: 3px solid #9C27B0;
}

.pattern-item {
    background: rgba(156, 39, 176, 0.1);
    border-left: 3px solid #9C27B0;
}

.issue-item.critical {
    background: rgba(244, 67, 54, 0.2);
}

.issue-item.warning {
    background: rgba(255, 152, 0, 0.1);
    border-left-color: #FF9800;
}

.correlation-strength {
    font-weight: 600;
    margin-left: 5px;
}

.correlation-strength.strong {
    color: #4CAF50;
}

.correlation-strength.moderate {
    color: #FFC107;
}

.correlation-strength.weak {
    color: #F44336;
}

.pattern-details {
    margin-top: 5px;
    font-size: 12px;
    color: #B0B0B0;
}

.pattern-prediction {
    margin-top: 5px;
    font-style: italic;
    color: #81C784;
}

.pattern-strength {
    font-weight: 600;
    margin-left: 5px;
}

.pattern-strength.strong {
    color: #4CAF50;
}

.pattern-strength.moderate {
    color: #FFC107;
}

.pattern-strength.weak {
    color: #F44336;
}
</style>

<script type="module">
import performanceDashboard from '../scripts/performance-dashboard.js';
import performanceAnalytics from '../scripts/performance-analytics.js';
import PerformanceVisualizer from '../scripts/performance-visualizer.js';
import PerformanceAnalyticsVisualizer from '../scripts/performance-analytics-visualizer.js';

// Initialize visualizers
const visualizer = new PerformanceVisualizer('performance-chart');
const analyticsVisualizer = new PerformanceAnalyticsVisualizer('analytics-chart');

// Toggle analytics view
window.toggleAnalytics = function() {
    const performanceChart = document.getElementById('performance-chart');
    const analyticsChart = document.getElementById('analytics-chart');
    
    if (performanceChart.style.display === 'none') {
        performanceChart.style.display = 'block';
        analyticsChart.style.display = 'none';
    } else {
        performanceChart.style.display = 'none';
        analyticsChart.style.display = 'block';
    }
};

// Update metric displays
function updateMetricDisplay(metric, value) {
    const valueElement = document.getElementById(`${metric}-value`);
    const trendElement = document.getElementById(`${metric}-trend`);
    const predictionElement = document.getElementById(`${metric}-prediction`);
    
    if (valueElement) {
        if (metric === 'memory') {
            valueElement.textContent = `${(value / 1024 / 1024).toFixed(1)}MB`;
        } else {
            valueElement.textContent = value.toFixed(1);
        }
    }
    
    if (trendElement) {
        const report = performanceDashboard.getPerformanceReport();
        const average = report.summary[metric].average;
        const trend = value > average ? '↑' : value < average ? '↓' : '→';
        trendElement.textContent = `Trend: ${trend}`;
    }

    if (predictionElement) {
        const analytics = performanceAnalytics.getAnalyticsReport();
        const prediction = analytics.metrics[metric].predictions[0];
        if (prediction) {
            predictionElement.textContent = `Predicted: ${prediction.value.toFixed(1)}`;
        }
    }
}

// Update issues list
function updateIssuesList(issues) {
    const issuesList = document.getElementById('issues-list');
    if (!issuesList) return;
    
    issuesList.innerHTML = issues.map(issue => `
        <div class="issue-item ${issue.severity}">
            <strong>${issue.type.toUpperCase()}</strong>: ${issue.message}
        </div>
    `).join('');
}

// Update recommendations
function updateRecommendations() {
    const recommendationsList = document.getElementById('recommendations-list');
    if (!recommendationsList) return;
    
    const analytics = performanceAnalytics.getAnalyticsReport();
    recommendationsList.innerHTML = analytics.suggestions.map(rec => `
        <div class="recommendation-item">
            <strong>${rec.type.toUpperCase()}</strong>: ${rec.message}
            <div class="recommendation-details">
                ${Object.entries(rec.details).map(([key, value]) => 
                    `<div>${key}: ${value}</div>`
                ).join('')}
            </div>
        </div>
    `).join('');
}

// Update correlations
function updateCorrelations() {
    const correlationsList = document.getElementById('correlations-list');
    if (!correlationsList) return;
    
    const analytics = performanceAnalytics.getAnalyticsReport();
    const correlations = [];
    
    Object.entries(analytics.metrics).forEach(([metric, data]) => {
        Object.entries(data.correlations).forEach(([correlatedMetric, value]) => {
            correlations.push({
                metric,
                correlatedMetric,
                value,
                strength: Math.abs(value) > 0.7 ? 'strong' : Math.abs(value) > 0.4 ? 'moderate' : 'weak'
            });
        });
    });
    
    correlationsList.innerHTML = correlations.map(corr => `
        <div class="correlation-item">
            <strong>${corr.metric.toUpperCase()}</strong> ↔ 
            <strong>${corr.correlatedMetric.toUpperCase()}</strong>
            <span class="correlation-strength ${corr.strength}">
                ${(corr.value * 100).toFixed(0)}%
            </span>
        </div>
    `).join('');
}

// Update patterns list
function updatePatterns() {
    const patternsList = document.getElementById('patterns-list');
    if (!patternsList) return;
    
    const analytics = performanceAnalytics.getAnalyticsReport();
    const patterns = [];
    
    Object.entries(analytics.patterns).forEach(([metric, metricPatterns]) => {
        metricPatterns.forEach(pattern => {
            patterns.push({
                metric,
                length: pattern.length,
                similarity: pattern.similarity,
                prediction: pattern.prediction,
                lastSeen: pattern.lastSeen
            });
        });
    });
    
    patternsList.innerHTML = patterns.map(pattern => `
        <div class="pattern-item">
            <strong>${pattern.metric.toUpperCase()}</strong>
            <div class="pattern-details">
                Length: ${pattern.length} points
                <span class="pattern-strength ${pattern.similarity > 0.9 ? 'strong' : pattern.similarity > 0.7 ? 'moderate' : 'weak'}">
                    ${(pattern.similarity * 100).toFixed(0)}% match
                </span>
            </div>
            ${pattern.prediction !== null ? `
                <div class="pattern-prediction">
                    Predicted next value: ${pattern.prediction.toFixed(1)}
                </div>
            ` : ''}
        </div>
    `).join('');
}

// Setup observers
performanceDashboard.addObserver((data) => {
    if (data.type === 'metricUpdate') {
        updateMetricDisplay(data.metric, data.value);
    } else if (data.type === 'performanceIssues') {
        updateIssuesList(data.issues);
    }
});

performanceAnalytics.addObserver((data) => {
    if (data.type === 'analyticsUpdate') {
        updateMetricDisplay(data.metric, data.data.history[data.data.history.length - 1]?.value);
        updateCorrelations();
        updatePatterns();
    }
});

// Initial updates
updateRecommendations();
updateCorrelations();
updatePatterns();

// Periodic updates
setInterval(() => {
    updateRecommendations();
    updateCorrelations();
    updatePatterns();
}, 5000);
</script>
