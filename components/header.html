<header class="header">
    <div class="container">
        <div class="header-content">
            <!-- Logo -->
            <div class="logo">
                <a href="index.html">
                    <img src="images/logo.png" alt="Nutrition Tracker" onerror="this.onerror=null; this.src='images/fallback-logo.png'; this.alt='Nutrition Tracker';">
                </a>
            </div>
            
            <!-- Desktop Navigation -->
            <nav class="nav-desktop">
                <ul class="nav-list">
                    <li class="nav-item"><a href="index.html" data-i18n="nav.home">Home</a></li>
                    <li class="nav-item"><a href="dashboard.html" data-i18n="nav.dashboard">Dashboard</a></li>
                    <li class="nav-item"><a href="food-log.html" data-i18n="nav.foodLog">Food Log</a></li>
                    <li class="nav-item"><a href="meal-planner.html" data-i18n="nav.mealPlanner">Meal Planner</a></li>
                    <li class="nav-item"><a href="recipes.html" data-i18n="nav.recipes">Recipes</a></li>
                    <li class="nav-item"><a href="reports.html" data-i18n="nav.reports">Reports</a></li>
                </ul>
            </nav>
            
            <!-- Header Actions -->
            <div class="header-actions">
                <!-- Theme Toggle -->
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                    <i class="fas fa-moon dark-icon"></i>
                    <i class="fas fa-sun light-icon"></i>
                </button>
                
                <!-- Language Dropdown -->
                <div class="dropdown-container lang-selector">
                    <button class="dropdown-toggle" data-dropdown="language-dropdown" aria-expanded="false">
                        <span id="currentLang">EN</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div id="language-dropdown" class="dropdown-menu">
                        <select id="language-selector" aria-label="Select language">
                            <option value="en">English</option>
                            <option value="es">Español</option>
                            <option value="fr">Français</option>
                        </select>
                    </div>
                </div>
                
                <!-- User Dropdown or Login/Signup -->
                <div class="dropdown-container user-menu">
                    <button class="dropdown-toggle" data-dropdown="user-dropdown" aria-expanded="false">
                        <i class="fas fa-user"></i>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div id="user-dropdown" class="dropdown-menu">
                        <ul>
                            <li><a href="login.html" data-i18n="nav.login">Login</a></li>
                            <li><a href="signup.html" data-i18n="nav.signup">Sign Up</a></li>
                        </ul>
                    </div>
                </div>
                
                <!-- Mobile Menu Toggle -->
                <button id="mobile-menu-toggle" class="mobile-menu-toggle" aria-expanded="false" aria-label="Toggle menu">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Mobile Navigation -->
    <div class="mobile-nav">
        <div class="mobile-nav-container">
            <nav>
                <ul class="mobile-nav-list">
                    <li class="mobile-nav-item"><a href="index.html" data-i18n="nav.home">Home</a></li>
                    <li class="mobile-nav-item"><a href="dashboard.html" data-i18n="nav.dashboard">Dashboard</a></li>
                    <li class="mobile-nav-item"><a href="food-log.html" data-i18n="nav.foodLog">Food Log</a></li>
                    <li class="mobile-nav-item"><a href="meal-planner.html" data-i18n="nav.mealPlanner">Meal Planner</a></li>
                    <li class="mobile-nav-item"><a href="recipes.html" data-i18n="nav.recipes">Recipes</a></li>
                    <li class="mobile-nav-item"><a href="reports.html" data-i18n="nav.reports">Reports</a></li>
                    <li class="mobile-nav-item"><a href="profile.html" data-i18n="nav.profile">Profile</a></li>
                    <li class="mobile-nav-item"><a href="settings.html" data-i18n="nav.settings">Settings</a></li>
                </ul>
            </nav>
            
            <div class="mobile-nav-actions">
                <div class="mobile-theme-toggle">
                    <span data-i18n="common.darkMode">Dark Mode</span>
                    <label class="switch">
                        <input type="checkbox" id="mobile-theme-toggle-checkbox">
                        <span class="slider round"></span>
                    </label>
                </div>
                
                <div class="mobile-language">
                    <label for="mobile-language-selector" data-i18n="nav.language">Language:</label>
                    <select id="mobile-language-selector" class="language-selector">
                        <option value="en">English</option>
                        <option value="es">Español</option>
                        <option value="fr">Français</option>
                    </select>
                </div>
                
                <div class="mobile-auth-buttons">
                    <a href="login.html" class="btn btn-secondary" data-i18n="nav.login">Login</a>
                    <a href="signup.html" class="btn btn-primary" data-i18n="nav.signup">Sign Up</a>
                </div>
            </div>
        </div>
    </div>
    <!-- Mobile Backdrop -->
    <div class="mobile-backdrop"></div>
</header>

<script>
// Initialize theme and language
document.addEventListener('DOMContentLoaded', function() {
    // Check if user is logged in
    const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
    const userAccount = document.getElementById('userAccount');
    const loginSignup = document.getElementById('loginSignup');
    
    if (isLoggedIn) {
        // Show user account dropdown, hide login/signup
        userAccount.style.display = 'block';
        loginSignup.style.display = 'none';
        
        // Set user name and avatar if available
        const userName = localStorage.getItem('userName');
        const userAvatar = localStorage.getItem('userAvatar');
        
        if (userName) {
            document.getElementById('userName').textContent = userName;
        }
        
        if (userAvatar) {
            document.getElementById('userAvatar').src = userAvatar;
        }
    } else {
        // Show login/signup, hide user account dropdown
        userAccount.style.display = 'none';
        loginSignup.style.display = 'block';
    }
    
    // Language dropdown toggle
    const langBtn = document.getElementById('langBtn');
    const langDropdown = document.getElementById('langDropdown');
    
    if (langBtn && langDropdown) {
        langBtn.addEventListener('click', function(e) {
            e.preventDefault();
            langDropdown.classList.toggle('show');
            langBtn.setAttribute('aria-expanded', langDropdown.classList.contains('show'));
        });
        
        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.lang-selector') && langDropdown.classList.contains('show')) {
                langDropdown.classList.remove('show');
                langBtn.setAttribute('aria-expanded', 'false');
            }
        });
        
        // Language selection
        const langItems = document.querySelectorAll('.lang-item');
        langItems.forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const lang = this.getAttribute('data-lang');
                
                // Update current language display
                document.getElementById('currentLang').textContent = lang.toUpperCase();
                
                // Update active class
                langItems.forEach(item => item.classList.remove('active'));
                this.classList.add('active');
                
                // Close dropdown
                langDropdown.classList.remove('show');
                
                // Change language through i18n.js
                if (window.changeLanguage) {
                    window.changeLanguage(lang);
                }
            });
        });
    }
    
    // Theme toggle
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = themeToggle.querySelector('i');
    
    if (themeToggle) {
        // Check current theme
        const isDarkMode = localStorage.getItem('darkMode') === 'true';
        
        // Update icon based on current theme
        if (isDarkMode) {
            themeIcon.classList.replace('fa-moon', 'fa-sun');
            document.body.classList.add('dark-mode');
        } else {
            themeIcon.classList.replace('fa-sun', 'fa-moon');
            document.body.classList.remove('dark-mode');
        }
        
        // Toggle theme on click
        themeToggle.addEventListener('click', function() {
            const isDarkMode = document.body.classList.toggle('dark-mode');
            
            // Update icon
            if (isDarkMode) {
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            } else {
                themeIcon.classList.replace('fa-sun', 'fa-moon');
            }
            
            // Save preference
            localStorage.setItem('darkMode', isDarkMode);
            
            // Notify theme manager if it exists
            if (window.themeManager) {
                window.themeManager.setTheme(isDarkMode ? 'dark' : 'light');
            }
        });
    }
    
    // Header scroll effect
    const header = document.querySelector('.header');
    
    if (header) {
        // Initial check for current scroll position
        if (window.scrollY > 50) {
            header.classList.add('header-scrolled');
        }

        // Add scroll event listener
        window.addEventListener('scroll', function() {
            if (window.scrollY > 50) {
                header.classList.add('header-scrolled');
            } else {
                header.classList.remove('header-scrolled');
            }
        });
        
        // Hide header on scroll down, show on scroll up
        let lastScrollTop = 0;
        
        window.addEventListener('scroll', function() {
            const scrollTop = window.scrollY || document.documentElement.scrollTop;
            
            if (scrollTop > lastScrollTop && scrollTop > 150) {
                // Scrolling down & past threshold
                header.classList.add('hidden');
            } else {
                // Scrolling up
                header.classList.remove('hidden');
            }
            
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        }, { passive: true });
    }
});
</script>
