<!-- Mobile Navigation Toggle Button -->
<button 
    class="mobile-menu-toggle" 
    id="mobileNavToggle" 
    aria-label="Toggle navigation menu"
    aria-expanded="false"
    aria-controls="mobileNav">
    <span></span>
    <span></span>
    <span></span>
</button>

<!-- Mobile Navigation Overlay -->
<div 
    class="mobile-nav-overlay" 
    id="mobileNavOverlay"
    aria-hidden="true"
    tabindex="-1">
</div>

<!-- Mobile Navigation -->
<nav 
    class="mobile-nav" 
    id="mobileNav"
    aria-label="Main navigation"
    aria-hidden="true">
    
    <div class="mobile-nav-header">
        <h2 class="mobile-nav-title">Menu</h2>
        <button 
            class="mobile-nav-close" 
            aria-label="Close navigation menu"
            aria-controls="mobileNav">
            <i class="fas fa-times" aria-hidden="true"></i>
        </button>
    </div>
    
    <div class="mobile-nav-menu">
        <a href="index.html" class="mobile-nav-item">
            <i class="fas fa-home" aria-hidden="true"></i>
            <span>Home</span>
        </a>
        <a href="dashboard.html" class="mobile-nav-item">
            <i class="fas fa-chart-line" aria-hidden="true"></i>
            <span>Dashboard</span>
        </a>
        <a href="meals.html" class="mobile-nav-item">
            <i class="fas fa-utensils" aria-hidden="true"></i>
            <span>Meals</span>
        </a>
        <a href="settings.html" class="mobile-nav-item">
            <i class="fas fa-cog" aria-hidden="true"></i>
            <span>Settings</span>
        </a>
    </div>
    
    <div class="mobile-nav-footer">
        <div class="mobile-auth-buttons">
            <a href="login.html" class="btn btn-primary">Login</a>
            <a href="register.html" class="btn btn-secondary">Register</a>
        </div>
    </div>
</nav>

<script>
    // Initialize the theme toggle in mobile navigation
    document.addEventListener('DOMContentLoaded', function() {
        const mobileThemeToggle = document.querySelector('.mobile-nav .theme-toggle');
        if (mobileThemeToggle && window.themeManager) {
            // Set initial state based on current theme
            const currentTheme = document.documentElement.className;
            mobileThemeToggle.setAttribute('aria-label', `Switch to ${currentTheme === 'dark' ? 'light' : 'dark'} theme`);
            
            // Listen for theme changes
            document.addEventListener('themechange', function(e) {
                const newTheme = e.detail.theme;
                mobileThemeToggle.setAttribute('aria-label', `Switch to ${newTheme === 'dark' ? 'light' : 'dark'} theme`);
            });
            
            // Listen for clicks
            mobileThemeToggle.addEventListener('click', function() {
                window.themeManager.toggleTheme();
            });
        }
        
        // Set language selector value
        const mobileLangSelector = document.getElementById('mobile-language-selector');
        if (mobileLangSelector) {
            const currentLang = document.documentElement.lang || 'en';
            mobileLangSelector.value = currentLang;
        }
    });
</script>
