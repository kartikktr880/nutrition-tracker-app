<script>
    // Initialize the theme toggle in mobile navigation
    document.addEventListener('DOMContentLoaded', function() {
        const mobileThemeToggle = document.getElementById('mobile-theme-toggle-switch');
        if (mobileThemeToggle && window.themeManager) {
            // Set initial state based on current theme
            mobileThemeToggle.checked = window.themeManager.getCurrentTheme() === 'dark';
            
            // Listen for changes
            mobileThemeToggle.addEventListener('change', function() {
                window.themeManager.setTheme(this.checked ? 'dark' : 'light');
            });
        }
        
        // Set language selector value
        const mobileLangSelector = document.getElementById('mobile-language-selector');
        if (mobileLangSelector) {
            const currentLang = document.documentElement.lang || 
                               localStorage.getItem('preferredLanguage') || 
                               'en';
            mobileLangSelector.value = currentLang;
            
            mobileLangSelector.addEventListener('change', function() {
                if (window.i18n && typeof window.i18n.changeLanguage === 'function') {
                    window.i18n.changeLanguage(this.value);
                } else {
                    localStorage.setItem('preferredLanguage', this.value);
                    window.location.reload();
                }
            });
        }
    });
</script>
